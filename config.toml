# The URL the site will be built for
base_url = "https://kchitnis.com"
title = "kchitnis"
description = "Kshitij Chitnis's blog website"
# Whether to automatically compile all Sass files in the sass directory
compile_sass = true

# Whether to build a search index to be used later on by a JavaScript library
build_search_index = true

theme = "apollo"
taxonomies = [{ name = "tags" }]

[markdown]
# Whether to do syntax highlighting
# Theme can be customised by setting the `highlight_theme` variable to a theme supported by Zola
highlight_code = true
highlight_theme = "ayu-light"

[extra]
# Put all your custom variables here

#toc =true
use_cdn = false
theme = "auto"
favicon = "favicon.ico"
comment = false
fancy_code = true
dynamic_note = true           # a note that can be toggled
mathjax = true
mathjax_dollar_inline_enable = true

menu = [
    { name = "/blogs", url = "/posts", weight = 1 },
    { name = "/about", url = "about", weight = 2},
]

socials = [
    { name = "twitter", url = "https://twitter.com/morphtail", icon = "twitter" },
    { name = "github", url = "https://github.com/m0rphtail/", icon = "github" },
    { name = "linkedin", url = "https://linkedin.com/in/kshitijchitnis", icon = "linkedin" },
    { name = "email", url = "mailto:chitniskshitij@gmail.com", icon = "email" },
]

[extra.analytics]
enabled = true

[extra.analytics.goatcounter]
user = "kchitnis"