# The URL the site will be built for
base_url = "https://kchitnis.com"
title = "kchitnis"
description = "Kshitij Chitnis's blog website"
# Whether to automatically compile all Sass files in the sass directory
compile_sass = true
minify_html = true

# Whether to build a search index to be used later on by a JavaScript library
build_search_index = false

theme = "apollo"
taxonomies = [{ name = "tags" }]

[markdown]
# Whether to do syntax highlighting
# Theme can be customised by setting the `highlight_theme` variable to a theme supported by Zola
highlight_code = true
highlight_theme = "ayu-light"

[extra]
# Put all your custom variables here

toc = false
use_cdn = true
theme = "auto"
favicon = "favicon.ico"
comment = false
fancy_code = false
dynamic_note = false           # a note that can be toggled
mathjax = true
mathjax_dollar_inline_enable = true

menu = [
    { name = "/blogs", url = "/blogs", weight = 1 },
    { name = "/resume", url = "/resume", weight = 2},
    { name = "/art", url = "/art", weight = 3},
    { name = "/music", url = "/music", weight =4}
]

socials = [
    { name = "github", url = "https://github.com/m0rphtail/", icon = "github" },
    { name = "linkedin", url = "https://linkedin.com/in/kshitijchitnis", icon = "linkedin" },
    { name = "email", url = "mailto:chitniskshitij@gmail.com", icon = "email" },
]

[extra.analytics]
enabled = true

[extra.analytics.goatcounter]
user = "kchitnis"